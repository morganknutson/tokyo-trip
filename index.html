<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<title>Travel guide</title>

<script src="config.js"></script>
<script>
  // Apply the theme before first paint to avoid a flash.
  (function () {
    var pref = (window.TRIP && TRIP.theme) || 'auto';
    var dark = pref === 'dark' || (pref === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    if (pref === 'auto') {
      matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function (e) {
        document.documentElement.dataset.theme = e.matches ? 'dark' : 'light';
      });
    }
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="styles/tokens.css">
<link rel="stylesheet" href="styles/app.css">
</head>
<body>

<header class="header">
  <div class="header-top">
    <div>
      <h1 class="wordmark" id="wordmark"></h1>
      <div class="header-dates" id="headerDates"></div>
    </div>
    <button class="schedule-toggle" id="scheduleToggle" aria-expanded="false" aria-controls="scheduleDrawer">
      <span class="schedule-toggle-label">Schedule</span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
    </button>
  </div>
  <div class="schedule-drawer" id="scheduleDrawer">
    <div class="schedule-content" id="scheduleContent"></div>
  </div>
</header>

<div class="controls" id="controls">
  <div class="search-bar">
    <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
    <input type="search" id="searchInput" placeholder="Search places, areas, tags" aria-label="Search places">
    <button class="search-clear" id="searchClear" aria-label="Clear search">&times;</button>
  </div>
  <div class="filter-row" id="filterRow"></div>
</div>

<main>
  <div id="tabPlan" class="tab-content active"><div id="planContent"></div></div>
  <div id="tabPlaces" class="tab-content"><div class="cards" id="placesCards"></div></div>
  <div id="tabInfo" class="tab-content"><div id="infoContent"></div></div>
</main>

<div class="undo-toast" id="undoToast" role="status">
  <span class="undo-toast-text" id="undoToastText"></span>
  <button class="undo-toast-btn" id="undoToastBtn">Undo</button>
</div>

<!-- Tab buttons are added from config.js (TRIP.tabs) by app.js. -->
<nav class="bottom-nav" id="bottomNav" aria-label="Sections">
  <button class="nav-more-btn" id="navMore" aria-expanded="false" aria-controls="navDrawer">
    <span class="nav-more-icons">
      <span id="navMoreIcon" class="nav-more-icon"></span>
      <svg class="nav-more-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M18 15l-6-6-6 6"/></svg>
    </span>
    <span id="navMoreLabel">More</span>
  </button>
  <div class="nav-drawer" id="navDrawer">
    <div class="nav-divider"></div>
    <div class="nav-drawer-grid" id="navDrawerGrid"></div>
  </div>
</nav>

<script src="app.js"></script>
</body>
</html>
